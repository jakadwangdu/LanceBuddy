name: Deploy React Web to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: react-web/package-lock.json

      - name: Install dependencies
        working-directory: react-web
        run: |
          if [ -f package-lock.json ]; then
            npm ci || npm install
          else
            npm install
          fi

      - name: Build React Application
        working-directory: react-web
        run: npm run build

      - name: Verify CNAME, Ads.txt, Robots, and Sitemap
        run: |
          # Copy CNAME if in root or public
          if [ -f "CNAME" ] && [ ! -f "react-web/dist/CNAME" ]; then
            cp CNAME react-web/dist/CNAME
          fi
          # Copy ads.txt if in root or public
          if [ -f "ads.txt" ] && [ ! -f "react-web/dist/ads.txt" ]; then
            cp ads.txt react-web/dist/ads.txt
          fi
          # Copy robots.txt if in root or public
          if [ -f "robots.txt" ] && [ ! -f "react-web/dist/robots.txt" ]; then
            cp robots.txt react-web/dist/robots.txt
          fi
          # Copy sitemap.xml if in root or public
          if [ -f "sitemap.xml" ] && [ ! -f "react-web/dist/sitemap.xml" ]; then
            cp sitemap.xml react-web/dist/sitemap.xml
          fi
          echo "Build output contents:"
          ls -la react-web/dist

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: react-web/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
