name: Deploy React App to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci || npm install
          else
            npm install
          fi

      - name: Build React Application
        run: npm run build

      - name: Verify CNAME, Ads.txt, Robots, and Sitemap in dist
        run: |
          # Ensure CNAME exists in dist
          if [ -f "CNAME" ] && [ ! -f "dist/CNAME" ]; then
            cp CNAME dist/CNAME
          fi
          # Ensure ads.txt exists in dist
          if [ -f "ads.txt" ] && [ ! -f "dist/ads.txt" ]; then
            cp ads.txt dist/ads.txt
          fi
          # Ensure robots.txt exists in dist
          if [ -f "public/robots.txt" ] && [ ! -f "dist/robots.txt" ]; then
            cp public/robots.txt dist/robots.txt
          fi
          # Ensure sitemap.xml exists in dist
          if [ -f "public/sitemap.xml" ] && [ ! -f "dist/sitemap.xml" ]; then
            cp public/sitemap.xml dist/sitemap.xml
          fi
          echo "Build output contents:"
          ls -la dist

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

