<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loading Dhun App...</title>
    
    <style>
        /* Reset defaults for a clean slate */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Full screen layout with a modern dark theme */
        body {
            height: 100vh;
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #121212; /* Deep dark background */
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden; /* Prevent scrolling while loading */
        }

        /* Container to stack the loader and text vertically */
        .loading-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 32px; /* Space between loader and text */
            animation: fadeIn 0.8s ease-out forwards;
        }

        /* --- USER PROVIDED LOADER CSS (Cleaned up for proper execution) --- */
        .loader {
            width: 40px;
            aspect-ratio: 1;
            color: #f03355; /* The primary red/pink color */
            position: relative;
            background: radial-gradient(10px, currentColor 94%, #0000);
        }

        .loader:before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 50%;
            background:
                radial-gradient(9px at bottom right, #0000 94%, currentColor) top left,
                radial-gradient(9px at bottom left, #0000 94%, currentColor) top right,
                radial-gradient(9px at top right, #0000 94%, currentColor) bottom left,
                radial-gradient(9px at top left, #0000 94%, currentColor) bottom right;
            background-size: 20px 20px;
            background-repeat: no-repeat;
            animation: l18 1.5s infinite cubic-bezier(0.3, 1, 0, 1);
        }

        @keyframes l18 {
            33%  { inset: -10px; transform: rotate(0deg); }
            66%  { inset: -10px; transform: rotate(90deg); }
            100% { inset: 0; transform: rotate(90deg); }
        }
        /* ------------------------------------------------------------------ */

        /* Stylish text to accompany the loader */
        .loading-text {
            color: #ffffff;
            font-size: 1.1rem;
            font-weight: 500;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            opacity: 0.8;
            animation: pulseText 1.5s infinite ease-in-out;
        }

        /* Animations for the container and text */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes pulseText {
            0% { opacity: 0.5; }
            50% { opacity: 1; }
            100% { opacity: 0.5; }
        }
    
    /* Nav Animation */
    .nav-links a{position:relative;padding-bottom:2px;}
    .nav-links a::after{content:'';position:absolute;width:0;height:2px;bottom:0;left:0;background-color:var(--text);transition:width .3s cubic-bezier(.4,0,.2,1);}
    .nav-links a:hover::after,.nav-links a.active::after{width:100%;}
    html.dark .nav-links a::after{background-color:#fff;}
  
      
    .nav-signup-btn {
        padding: 8px 18px !important;
        border-radius: 8px !important;
        background: var(--text) !important;
        color: var(--bg) !important;
        font-weight: 700 !important;
        transition: transform 0.2s, box-shadow 0.2s !important;
        text-decoration: none !important;
        border: 2px solid var(--border) !important;
    }
    .nav-signup-btn:hover {
        transform: translate(-2px, -2px) !important;
        box-shadow: 4px 4px 0px var(--border) !important;
    }
    .nav-signup-btn::after { display: none !important; }
  
    [class^="ri-"], [class*=" ri-"] {
        transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1), color 0.3s;
        display: inline-block;
    }
    button:hover [class^="ri-"], button:hover [class*=" ri-"], a:hover [class^="ri-"], a:hover [class*=" ri-"] {
        transform: scale(1.15) rotate(4deg);
    }
    .ri-spin-anim {
        animation: ri-spin 1s infinite linear;
    }
    @keyframes ri-spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(359deg); }
    }
  
    .profile-menu-wrapper { position: relative !important; }
  </style>
    <style>
    .profile-btn, #theme-btn, #ham-btn {
        border: 2px solid var(--border) !important;
        border-radius: 8px !important;
        background: var(--surface) !important;
        box-shadow: 2px 2px 0px var(--border) !important;
        transition: transform 0.2s, box-shadow 0.2s !important;
    }
    .profile-btn:hover, #theme-btn:hover, #ham-btn:hover {
        transform: translate(-2px, -2px) !important;
        box-shadow: 4px 4px 0px var(--border) !important;
    }
    .profile-btn:active, #theme-btn:active, #ham-btn:active {
        transform: translate(0px, 0px) !important;
        box-shadow: 0px 0px 0px var(--border) !important;
    }
    .profile-dropdown {
        border: 2px solid var(--border) !important;
        border-radius: 8px !important;
        box-shadow: 4px 4px 0px var(--border) !important;
        top: calc(100% + 12px) !important;
    }
    .profile-avatar {
        border: 2px solid var(--border) !important;
        background: var(--text) !important;
        color: var(--bg) !important;
        border-radius: 8px !important;
    }
    .profile-dropdown-item {
        border-radius: 6px !important;
    }
    
    .profile-menu-wrapper { position: relative !important; }
  </style>
  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore-compat.js"></script>
  <!-- Firebase Config -->
  <script src="firebase-config.js"></script>
<style>
/* GLOBAL PROFILE MENU CORE + BRUTALIST CSS */
.profile-menu-wrapper { position: relative !important; }
.profile-btn {
    display: flex; align-items: center; gap: 8px; padding: 6px 12px 6px 6px;
    border: 2px solid var(--border) !important;
    border-radius: 8px !important;
    background: var(--surface) !important;
    box-shadow: 2px 2px 0px var(--border) !important;
    cursor: pointer; transition: transform 0.2s, box-shadow 0.2s !important;
    font-family: 'Inter', sans-serif;
}
.profile-btn:hover {
    transform: translate(-2px, -2px) !important;
    box-shadow: 4px 4px 0px var(--border) !important;
}
.profile-btn:active {
    transform: translate(0px, 0px) !important;
    box-shadow: 0px 0px 0px var(--border) !important;
}
.profile-btn .ri-user-3-line { font-size: 24px; color: var(--text); }
.profile-name { font-size: 13px; font-weight: 600; color: var(--text); max-width: 90px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.profile-chevron { font-size: 12px; color: var(--muted); transition: transform 0.2s; }
.profile-btn.active .profile-chevron { transform: rotate(180deg); }

.profile-dropdown {
    position: absolute; top: calc(100% + 12px) !important; right: 0; width: 240px;
    background: var(--surface);
    border: 2px solid var(--border) !important;
    border-radius: 8px !important;
    box-shadow: 4px 4px 0px var(--border) !important;
    padding: 10px; opacity: 0; visibility: hidden; transform: translateY(-8px);
    transition: opacity 0.2s, transform 0.2s, visibility 0.2s; z-index: 300;
}
.profile-dropdown.open { opacity: 1; visibility: visible; transform: translateY(0); }
.profile-dropdown-header { display: flex; align-items: center; gap: 12px; padding: 8px; }

.profile-avatar {
    width: 40px; height: 40px; 
    border: 2px solid var(--border) !important;
    border-radius: 8px !important;
    background: var(--text) !important; color: var(--bg) !important;
    display: flex; align-items: center; justify-content: center;
    font-weight: 900; font-size: 16px; flex-shrink: 0;
}
.profile-info { display: flex; flex-direction: column; min-width: 0; }
.profile-display-name { font-size: 14px; font-weight: 800; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.profile-display-email { font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 600; }
.profile-dropdown-divider { height: 2px; background: var(--border); margin: 6px 0; }
.profile-dropdown-item {
    width: 100%; display: flex; align-items: center; gap: 10px; padding: 10px 12px;
    border: 2px solid transparent !important; background: none; border-radius: 6px !important;
    cursor: pointer; font-size: 13px; font-weight: 700; font-family: 'Inter', sans-serif;
    color: var(--text); transition: all 0.15s; text-align: left;
}
.profile-dropdown-item:hover {
    background: var(--input-bg);
    border: 2px solid var(--border) !important;
}
.profile-dropdown-item i { font-size: 16px; width: 18px; text-align: center; }
.profile-dropdown-item.logout-btn { color: #ef4444; }
.profile-dropdown-item.logout-btn:hover { background: rgba(239, 68, 68, 0.1); border-color: #ef4444 !important; }
</style>
</head>
<body>
    <div class="loading-container">
        <!-- Your specific loader element -->
        <div class="loader"></div>
        
        <!-- Accompanying text -->
        <div class="loading-text">Loading Dhun App</div>
    </div>
<script>
document.addEventListener('DOMContentLoaded', function() {
    function updateGlobalAuthUI() {
        try {
            const user = JSON.parse(localStorage.getItem('lb_current_user'));
            const signinLinks = document.querySelectorAll('a[href="LogIn/index.html"], a[href="LogIn/index.html?mode=signup"], .nav-signin-link, .nav-signup-btn');
            
            if (user) {
                // User is logged in: hide Sign In / Sign Up
                signinLinks.forEach(link => {
                    if (link) link.style.display = 'none';
                });
                
                
            } else {
                // User is guest: show Sign In / Sign Up
                signinLinks.forEach(link => {
                    if (link) link.style.display = '';
                });
            }
        } catch(e) {}
    }
    updateGlobalAuthUI();
});
</script>
<script>
document.addEventListener('DOMContentLoaded', function() {
    const profileBtn = document.getElementById('profile-btn');
    const profileDropdown = document.getElementById('profile-dropdown');
    const profileName = document.getElementById('nav-profile-name');
    const dropdownAvatar = document.getElementById('dropdown-avatar');
    const dropdownName = document.getElementById('dropdown-name');
    const dropdownEmail = document.getElementById('dropdown-email');
    
    if(!profileBtn) return;

    function getCurrentUser() {
        try { return JSON.parse(localStorage.getItem('lb_current_user')); }
        catch (e) { return null; }
    }

    function updateProfileUI() {
        const user = getCurrentUser();
        if (user) {
            const name = user.name || 'User';
            profileName.textContent = name.length > 10 ? name.substring(0, 10) + '...' : name;
            dropdownAvatar.textContent = name.charAt(0).toUpperCase();
            dropdownName.textContent = name;
            dropdownEmail.textContent = user.email || '';
            profileBtn.classList.remove('guest');
            profileBtn.style.display = 'flex';
        } else {
            profileBtn.style.display = 'none';
        }
    }

    profileBtn.addEventListener('click', function(e) {
        e.stopPropagation();
        const user = getCurrentUser();
        if (!user) {
            window.location.href = (window.location.pathname.includes('/LogIn/') ? 'index.html' : 'LogIn/index.html');
            return;
        }
        const isOpen = profileDropdown.classList.contains('open');
        if (isOpen) {
            profileDropdown.classList.remove('open');
            profileBtn.classList.remove('active');
        } else {
            updateProfileUI();
            profileDropdown.classList.add('open');
            profileBtn.classList.add('active');
        }
    });

    document.addEventListener('click', function(e) {
        if (profileDropdown && !profileDropdown.contains(e.target) && !profileBtn.contains(e.target)) {
            profileDropdown.classList.remove('open');
            profileBtn.classList.remove('active');
        }
    });

    const logoutBtn = document.getElementById('logout-btn');
    if(logoutBtn) {
        logoutBtn.addEventListener('click', function() {
            localStorage.removeItem('lb_current_user');
            window.location.href = (window.location.pathname.includes('/LogIn/') ? 'index.html' : 'LogIn/index.html');
        });
    }

    updateProfileUI();
});
</script>
</body>
</html>
